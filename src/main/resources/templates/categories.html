<!doctype html><html lang="vi" xmlns:th="https://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category | GraphQL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand bg-dark navbar-dark"><div class="container"><a class="navbar-brand" href="/ajax/categories">GraphQL Catalog</a><div class="navbar-nav"><a class="nav-link active" href="/ajax/categories">Category</a><a class="nav-link" href="/ajax/products">Product</a></div></div></nav>
<main class="container py-4"><div id="notice"></div><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Quản lý Category</h1><p class="text-secondary mb-0">Dữ liệu được tải trực tiếp bằng GraphQL.</p></div><button class="btn btn-primary" id="new-category">Thêm Category</button></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Tên</th><th>Images</th><th>Users</th><th>Products</th><th class="text-end">Thao tác</th></tr></thead><tbody id="category-body"></tbody></table></div><div id="loading" class="p-4 text-center text-secondary">Đang tải...</div></div></main>
<div class="modal fade" id="category-modal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="category-form"><div class="modal-header"><h2 class="modal-title fs-5" id="category-modal-title">Thêm Category</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="category-id" type="hidden"><div class="mb-3"><label class="form-label" for="category-name">Tên *</label><input class="form-control" id="category-name" maxlength="120" required></div><div class="mb-3"><label class="form-label" for="category-images">Images (URL/tên ảnh)</label><input class="form-control" id="category-images" maxlength="1000"></div><div><label class="form-label" for="category-users">Users</label><select class="form-select" id="category-users" multiple size="6"></select><div class="form-text">Giữ Ctrl/Cmd để chọn nhiều User.</div></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu</button></div></form></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/graphql-client.js}"></script><script th:src="@{/js/category.js}"></script></body></html>
