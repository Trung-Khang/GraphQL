<!doctype html><html lang="vi" xmlns:th="https://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | GraphQL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand bg-dark navbar-dark"><div class="container"><a class="navbar-brand" href="/ajax/categories">GraphQL Catalog</a><div class="navbar-nav"><a class="nav-link" href="/ajax/categories">Category</a><a class="nav-link active" href="/ajax/products">Product</a></div></div></nav>
<main class="container py-4"><div id="notice"></div><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="h3 mb-1">Quản lý Product</h1><p class="text-secondary mb-0">CRUD, giá tăng dần và lọc Category qua GraphQL.</p></div><button class="btn btn-primary" id="new-product">Thêm Product</button></div><div class="card shadow-sm"><div class="card-body d-flex flex-wrap gap-2"><button class="btn btn-outline-secondary active" id="all-products">Tất cả</button><button class="btn btn-outline-secondary" id="price-products">Giá thấp đến cao</button><select class="form-select w-auto" id="category-filter"><option value="">Lọc theo Category...</option></select></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Title</th><th>Quantity</th><th>Desc</th><th>Price</th><th>User</th><th>Category</th><th class="text-end">Thao tác</th></tr></thead><tbody id="product-body"></tbody></table></div><div id="loading" class="p-4 text-center text-secondary">Đang tải...</div></div></main>
<div class="modal fade" id="product-modal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="product-form"><div class="modal-header"><h2 class="modal-title fs-5" id="product-modal-title">Thêm Product</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="product-id" type="hidden"><div class="mb-3"><label class="form-label" for="product-title">Title *</label><input class="form-control" id="product-title" maxlength="200" required></div><div class="row"><div class="col mb-3"><label class="form-label" for="product-quantity">Quantity *</label><input class="form-control" id="product-quantity" type="number" min="0" required></div><div class="col mb-3"><label class="form-label" for="product-price">Price *</label><input class="form-control" id="product-price" type="number" min="0" step="0.01" required></div></div><div class="mb-3"><label class="form-label" for="product-desc">Desc</label><textarea class="form-control" id="product-desc" maxlength="2000" rows="3"></textarea></div><div class="mb-3"><label class="form-label" for="product-user">User *</label><select class="form-select" id="product-user" required></select></div><div><label class="form-label" for="product-category">Category *</label><select class="form-select" id="product-category" required></select></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu</button></div></form></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/graphql-client.js}"></script><script th:src="@{/js/product.js}"></script></body></html>
